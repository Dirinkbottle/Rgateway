<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Watchdog 安全测试</title>
  <style>
    body { font-family: monospace; max-width: 900px; margin: 20px auto; background: #1a1a1a; color: #e0e0e0; }
    h1 { color: #00ff88; }
    h2 { color: #ffaa00; margin-top: 24px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    button { margin: 4px; padding: 6px 12px; cursor: pointer; background: #333; color: #e0e0e0; border: 1px solid #555; border-radius: 4px; }
    button:hover { background: #444; }
    .danger { border-color: #ff4444; color: #ff4444; }
    .danger:hover { background: #331111; }
    .safe { border-color: #00ff88; color: #00ff88; }
    .safe:hover { background: #113311; }
    #status { padding: 10px; background: #111; border: 1px solid #333; white-space: pre-wrap; min-height: 40px; margin-top: 10px; }
    .ok { color: #00ff88; }
    .err { color: #ff4444; }
    .info { color: #88aaff; }
  </style>
</head>
<body>
  <h1>Watchdog 安全测试面板</h1>

  <h2>初始化</h2>
  <button id="btn-load" class="safe">加载 Watchdog</button>
  <span id="init-status"></span>

  <h2>正常请求</h2>
  <button class="safe" data-test="normal-get">GET /api/sites</button>
  <button class="safe" data-test="normal-post">POST /api/test</button>

  <h2>SQL 注入测试</h2>
  <button class="danger" data-test="sql-or">OR '1'='1</button>
  <button class="danger" data-test="sql-union">UNION SELECT</button>
  <button class="danger" data-test="sql-drop">DROP TABLE</button>
  <button class="danger" data-test="sql-sleep">SLEEP()</button>
  <button class="danger" data-test="sql-comment">注释符 --</button>
  <button class="danger" data-test="sql-semicolon">分号链式攻击</button>

  <h2>XSS 测试</h2>
  <button class="danger" data-test="xss-script">&lt;script&gt; 标签</button>
  <button class="danger" data-test="xss-event">onclick 事件</button>
  <button class="danger" data-test="xss-jsproto">javascript: 协议</button>

  <h2>路径攻击</h2>
  <button class="danger" data-test="path-traversal">路径遍历 ../</button>
  <button class="danger" data-test="null-byte">空字节 %00</button>

  <h2>参数校验</h2>
  <button class="danger" data-test="wrong-type">类型错误 (page=abc)</button>
  <button class="danger" data-test="too-long">超长参数 (category=51chars)</button>
  <button class="danger" data-test="wrong-method">方法不允许 (DELETE /api/sites)</button>
  <button class="danger" data-test="no-rule">未注册端点 (/api/unknown)</button>

  <h2>测试结果</h2>
  <div id="status">点击按钮开始测试</div>

  <script type="module" src="app.js"></script>
</body>
</html>
