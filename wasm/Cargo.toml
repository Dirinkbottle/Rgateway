[package]
name = "openatomic-watchdog"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Performance", "Response", "Request",
    "RequestInit", "RequestMode", "Headers",
    "console", "WorkerGlobalScope",
] }
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
base64 = "0.22"
wasm-bindgen-futures = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
